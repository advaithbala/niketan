# niketan-managed

# ── General (true color + UTF-8) ─────────────────────────────────────
# Bootstrap rewrites this to tmux-256color when infocmp reports that terminfo; otherwise screen-256color.
set -g default-terminal "screen-256color"
# Catppuccin status/window styles use true-color hex (#rrggbb). The outer TERM must advertise RGB.
# Many terminals (VS Code, Ghostty, etc.) need a catch-all — listing only *256col* misses them.
set -ga terminal-overrides ",*256col*:Tc"
set -ga terminal-overrides ",xterm-256color:Tc"
set -ga terminal-overrides ",xterm-kitty:Tc"
set -ga terminal-overrides ",alacritty:Tc"
set -ga terminal-overrides ",wezterm:Tc"
set -ga terminal-overrides ",konsole-256color:Tc"
set -ga terminal-overrides ",ghostty:Tc"
set -ga terminal-overrides ",*:Tc"
%if "#{>=:#{version},3.4}"
set -as terminal-features ",*:RGB"
%endif

# Outer terminal title (e.g. Alacritty over SSH): hostname of this tmux server.
set -g set-titles on
set -g set-titles-string '#{hostname}'
%if "#{>=:#{version},3.4}"
set -g allow-passthrough on
%endif
# connect(1) execs tmux without a login shell — force title on client attach.
set-hook -g client-attached 'run -b "printf \"\\033]0;#{hostname}\\007\" >#{client_tty}"'

set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g focus-events on
set -g escape-time 0

# ── Prefix ───────────────────────────────────────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ── Navigation ───────────────────────────────────────────────────────
setw -g mode-keys vi

# Pane splits (keep | and - from before)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Alt-arrow pane switching (no prefix)
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# Vim-style pane switching with prefix
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing with prefix + H/J/K/L
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── Copy mode ────────────────────────────────────────────────────────
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# ── Convenience ──────────────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display "Config reloaded!"
bind c new-window -c "#{pane_current_path}"

# ── Catppuccin ───────────────────────────────────────────────────────
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_window_flags "icon"
set -g @catppuccin_status_background "default"

run ~/.tmux/plugins/catppuccin/tmux/catppuccin.tmux

# Pane colors: default is the host terminal background, which never matches Catppuccin mantle/base.
set -gF window-style 'bg=#{@thm_mantle},fg=#{@thm_fg}'
set -gF window-active-style 'bg=#{@thm_bg},fg=#{@thm_fg}'

# ── Status bar ───────────────────────────────────────────────────────
set -g status-position top
set -g status-left-length 40
set -g status-right-length 80

set -g status-left "#{E:@catppuccin_status_session}"
set -g status-right "#{E:@catppuccin_status_directory}#{E:@catppuccin_status_date_time}"

set -g @catppuccin_date_time_text " %H:%M"

# ── TPM (keep at the very bottom) ───────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
run '~/.tmux/plugins/tpm/tpm'
