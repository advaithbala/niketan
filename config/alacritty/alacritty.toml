# niketan-managed — font family token replaced by bootstrap; edit via ~/.config/alacritty/alacritty.toml after install
# Palette: Catppuccin Mocha (https://github.com/catppuccin/alacritty)

[general]
live_config_reload = true

[window]
padding = { x = 4, y = 4 }
opacity = 1.0

[font]
# Exact PostScript/family name must match the patched face from NERD_FONT_FAMILY (see lib/fonts.sh).
normal = { family = "__ALACRITTY_FONT_FAMILY__", style = "Regular" }
bold = { style = "Bold" }
italic = { style = "Italic" }
bold_italic = { style = "Bold Italic" }
size = 12.0
# When true, Alacritty draws only U+E0B0–U+E0B3 itself; Catppuccin/tmux use U+E0B6 () and other Nerd glyphs.
# false = draw powerline curves and icons from the Nerd Font.
builtin_box_drawing = false

[env]
COLORTERM = "truecolor"

[colors.primary]
background = "#1e1e2e"
foreground = "#cdd6f4"
dim_foreground = "#7f849c"
bright_foreground = "#cdd6f4"

[colors.cursor]
text = "#1e1e2e"
cursor = "#f5e0dc"

[colors.vi_mode_cursor]
text = "#1e1e2e"
cursor = "#b4befe"

[colors.search.matches]
foreground = "#1e1e2e"
background = "#a6adc8"

[colors.search.focused_match]
foreground = "#1e1e2e"
background = "#a6e3a1"

[colors.footer_bar]
foreground = "#1e1e2e"
background = "#a6adc8"

[colors.hints.start]
foreground = "#1e1e2e"
background = "#f9e2af"

[colors.hints.end]
foreground = "#1e1e2e"
background = "#a6adc8"

[colors.selection]
text = "#1e1e2e"
background = "#f5e0dc"

[colors.normal]
black = "#45475a"
red = "#f38ba8"
green = "#a6e3a1"
yellow = "#f9e2af"
blue = "#89b4fa"
magenta = "#f5c2e7"
cyan = "#94e2d5"
white = "#bac2de"

[colors.bright]
black = "#585b70"
red = "#f38ba8"
green = "#a6e3a1"
yellow = "#f9e2af"
blue = "#89b4fa"
magenta = "#f5c2e7"
cyan = "#94e2d5"
white = "#a6adc8"

[[colors.indexed_colors]]
index = 16
color = "#fab387"

[[colors.indexed_colors]]
index = 17
color = "#f5e0dc"
